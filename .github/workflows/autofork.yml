name: autofork

on:
  schedule:
    - cron: "7-59/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".autofork/**"]

permissions:
  actions: write
  contents: write
  issues: write
  id-token: write

concurrency: autofork

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Rust comes from rust-toolchain.toml, which rustup installs on first use.
      - uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: just,cargo-nextest
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - id: autofork
        uses: AVGVSTVS96/autofork@v1
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      # Pushes made with GITHUB_TOKEN start no workflows, but dispatches do.
      - name: Release the synced build
        if: steps.autofork.outputs.result == 'synced' && steps.autofork.outputs.tag != '' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.autofork.outputs.tag }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f tag="$TAG"

      - name: Capture Claude accounting
        if: always()
        uses: AVGVSTVS96/autofork/.github/actions/usage@bf88ce65d7096d600ebe31ea4e607260ba1b9826
