name: Fork CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/**"
      - "install-fork.sh"
      - "patches/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Validate patch packages
        run: python3 scripts/fork_sync.py validate

      - name: Run fork sync tests
        run: python3 scripts/test_fork_sync.py
